; Virtual Pets firmware.
;
; Three environments share one pure-C++ game core (lib/petcore):
;   native : host-side unit tests for the game core (no Arduino, no M5)  -> pio test -e native
;   sim    : desktop simulator; M5Unified/M5GFX drawing into an SDL2 window -> pio run -e sim -t exec
;   core2  : the real device, M5Stack Core2 (ESP32, Arduino framework)  -> pio run -e core2

[platformio]
default_envs = sim

[m5]
lib_deps =
    m5stack/M5Unified@0.3.0
    m5stack/M5GFX@0.3.0

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
; Tests link only the game core; there is no app to build here.
build_src_filter = -<*>

[env:sim]
platform = native
build_type = debug
; -xc++ : compile every source as C++ (M5GFX's SDL port expects it).
; pkg-config finds SDL2 wherever Homebrew (macOS) or apt (Linux CI) put it.
build_flags =
    -xc++
    -std=c++17
    !pkg-config --cflags --libs sdl2
    -DM5GFX_BOARD=board_M5StackCore2
    -DM5GFX_SCALE=2
lib_deps = ${m5.lib_deps}
build_src_filter = +<sim/> +<m5/>

[env:core2]
platform = espressif32@8.0.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
lib_deps = ${m5.lib_deps}
build_src_filter = +<core2/> +<m5/>
